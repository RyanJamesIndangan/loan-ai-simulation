name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: loan_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,env,.git,__pycache__
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,env,.git,__pycache__

    - name: Check code formatting with black
      run: |
        black --check --exclude='/(\.git|\.venv|venv|env|__pycache__|\.pytest_cache)/' .
      continue-on-error: true

    - name: Train ML model
      run: |
        python ml/train_model.py

    - name: Run tests
      env:
        DATABASE_URL: postgresql://admin:admin@localhost:5432/loan_ai_test
      run: |
        pytest tests/ -v --tb=short

  frontend-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./web
      run: npm ci

    - name: Run frontend tests
      working-directory: ./web
      run: npm test

    - name: Build frontend
      working-directory: ./web
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build backend Docker image
      run: |
        docker build -t ai-loan-decisioning:${{ github.sha }} .

    - name: Build frontend Docker image
      run: |
        docker build -t ai-loan-web:${{ github.sha }} ./web

    - name: Test backend Docker image
      run: |
        docker run --rm ai-loan-decisioning:${{ github.sha }} python -c "from api.main import app; print('Docker image works!')"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Security scan with safety
      run: |
        safety check --file requirements.txt
      continue-on-error: true

    - name: Security scan with bandit
      run: |
        bandit -r api/ ml/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload bandit report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: bandit-security-report
        path: bandit-report.json

